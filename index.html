<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkicaCAD Beta 0.83</title>
<meta name="description" content="SkicaCAD – parametrické 3D CAD v prohlížeči (testovací verze).">
<meta name="theme-color" content="#1B2430">
<script>try { var t = (JSON.parse(localStorage.getItem('kota-cad-settings')) || {}).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="application-name" content="SkicaCAD">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SkicaCAD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="version.js"></script>
<script src="js/i18n.js"></script>
<script>
  // PWA: service worker se registruje hned (nečeká na načtení three.js z CDN),
  // aby Chrome mohl aplikaci co nejdřív nabídnout k instalaci jako plnohodnotnou aplikaci.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // běžící aplikace si novou verzi vyhledá při návratu do popředí a pak každou půlhodinu
      const check = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.ready.then((r) => { if (r.active) r.active.postMessage('cache-cdn'); }).catch(() => {});
    // Nový service worker převzal řízení (a stránka už jednou řízená byla) = je dostupná nová verze.
    let notified = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || notified) return;
      notified = true;
      const showBar = () => {
        const bar = document.createElement('div');
        bar.className = 'updbar'; bar.setAttribute('role', 'status');
        const t = document.createElement('span'); t.textContent = 'Je k dispozici nová verze aplikace.';
        const ok = document.createElement('button'); ok.className = 'btn primary sm'; ok.textContent = 'Obnovit';
        ok.addEventListener('click', () => location.reload());
        const no = document.createElement('button'); no.className = 'btn sm'; no.textContent = 'Později';
        no.addEventListener('click', () => bar.remove());
        bar.append(t, ok, no); document.body.append(bar);
      };
      if (document.body) showBar(); else document.addEventListener('DOMContentLoaded', showBar);
    });
  }
  // Tlačítko „Nainstalovat aplikaci“ v nabídce Soubor (Chrome ukazuje i vlastní nabídku).
  window.__skicaInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    window.__skicaInstall = e;
    const b = document.getElementById('m-install'); if (b) b.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    window.__skicaInstall = null;
    const b = document.getElementById('m-install'); if (b) b.hidden = true;
  });
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('m-install'); if (!b) return;
    if (window.__skicaInstall) b.hidden = false;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone;
    if (ios) { b.hidden = false; b.textContent = 'Jak nainstalovat (iOS)'; }
    b.addEventListener('click', async () => {
      if (ios) { alert(window.I18N && I18N.lang === 'en' ? 'In Safari tap Share and choose “Add to Home Screen”.' : 'V Safari klepněte na Sdílet a zvolte „Přidat na plochu“.'); return; }
      const d = window.__skicaInstall; if (!d) return;
      window.__skicaInstall = null; b.hidden = true;
      d.prompt(); try { await d.userChoice; } catch (err) {}
    });
  });
</script>
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <div class="brand">
      <svg width="26" height="18" viewBox="0 0 30 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3v14M28 3v14M4.5 10h21M4.5 10l3-2.4M4.5 10l3 2.4M25.5 10l-3-2.4M25.5 10l-3 2.4"/></svg>
      <span>SkicaCAD</span><span class="beta" id="ver-badge" title="Testovací verze">Beta 0.83</span>
    </div>
    <button class="abtn" id="filebtn" aria-haspopup="true" aria-expanded="false" title="Soubor"><span class="ico" data-ic="menu" data-s="18"></span><span class="lbltxt">Soubor</span></button>
    <button class="abtn" id="undo" title="Zpět (Ctrl+Z)" aria-label="Zpět"><span class="ico" data-ic="undo" data-s="18"></span></button>
    <button class="abtn" id="redo" title="Znovu (Ctrl+Y)" aria-label="Znovu"><span class="ico" data-ic="redo" data-s="18"></span></button>
    <button class="abtn langbtn" id="langbtn" title="Jazyk / Language" aria-label="Jazyk / Language"><span class="ico" data-ic="globe" data-s="17"></span><span class="lc">CZ</span></button>
    <button class="abtn" id="themebtn" title="Vzhled" aria-label="Vzhled"><span class="ico"></span></button>
    <input class="docname" id="docname" type="text" maxlength="60" aria-label="Název návrhu" value="Bez názvu">
    <span style="width:98px;flex:none" class="lbltxt"></span>
    <div class="menu" id="filemenu" hidden>
      <button id="m-new">Nový návrh</button>
      <button id="m-library">Moje návrhy…<small>v prohlížeči</small></button>
      <button id="m-example">Otevřít ukázkový model</button>
      <hr>
      <button id="m-open">Otevřít návrh…<small>.json .zip</small></button>
      <button id="m-save">Uložit návrh<small>.json</small></button>
      <button id="m-backup">Zálohovat knihovnu<small>.zip</small></button>
      <button id="m-restore">Obnovit knihovnu ze zálohy…<small>.zip</small></button>
      <hr>
      <button id="m-import">Importovat…<small>.stl .obj .dxf .svg .zip</small></button>
      <button id="m-export-stl">Exportovat STL<small>.stl</small></button>
      <button id="m-export-obj">Exportovat OBJ<small>.obj</small></button>
      <button id="m-export">Exportovat vše (STL + OBJ + návrh)<small>.zip</small></button>
      <hr>
      <button id="m-install" hidden>Nainstalovat aplikaci</button>
    </div>
    <input type="file" id="fileinput" accept=".json,.zip,application/json,application/zip" hidden>
    <input type="file" id="importinput" accept=".stl,.obj,.dxf,.svg,.zip" hidden>
  </header>

  <nav class="ribbon" aria-label="Pás nástrojů">
    <div class="rtabs" role="tablist">
      <button class="rtab" role="tab" id="tab-solid" aria-selected="true">TĚLESO</button>
      <button class="rtab ctx" role="tab" id="tab-sketch" aria-selected="false" hidden>SKICA</button>
    </div>
    <div class="rbody" id="rbody"></div>
  </nav>

  <main class="main" id="vp">
    <div class="float browser" id="browser">
      <div class="phead"><button class="ibtn" id="bw-toggle" aria-label="Sbalit prohlížeč" title="Sbalit"><span class="ico" data-ic="chev" data-s="14"></span></button><span class="t">PROHLÍŽEČ</span></div>
      <ul class="tree" id="tree"></ul>
    </div>
    <div class="float cubewrap" id="cubewrap">
      <canvas id="viewcube" width="224" height="224" aria-label="Kostka pohledů"></canvas>
      <button class="homebtn" id="home" title="Výchozí pohled" aria-label="Výchozí pohled"><span class="ico" data-ic="home" data-s="14"></span></button>
    </div>
    <section class="float dialog" id="dialog" hidden aria-live="polite"></section>
    <div class="float navbar" id="navbar" role="toolbar" aria-label="Navigace">
      <button class="ibtn" id="nav-fit" title="Přizpůsobit (F6)" aria-label="Přizpůsobit"><span class="ico" data-ic="fit" data-s="18"></span></button>
      <button class="ibtn" id="nav-proj" title="Ortogonální / perspektivní pohled" aria-label="Projekce" aria-pressed="false"><span class="ico" data-ic="persp" data-s="18"></span></button>
      <button class="ibtn" id="nav-style" title="Styl zobrazení" aria-label="Styl zobrazení"><span class="ico" data-ic="style" data-s="18"></span></button>
      <span class="sep"></span>
      <button class="ibtn" id="nav-grid" title="Mřížka" aria-label="Mřížka" aria-pressed="true"><span class="ico" data-ic="grid" data-s="18"></span></button>
      <button class="ibtn" id="nav-snap" title="Přichytávání k mřížce" aria-label="Přichytávání" aria-pressed="true"><span class="ico" data-ic="snap" data-s="18"></span></button>
      <select id="nav-step" title="Krok přichytávání" aria-label="Krok přichytávání">
        <option value="0.5">0,5</option><option value="1" selected>1 mm</option><option value="5">5 mm</option><option value="10">10 mm</option>
      </select>
    </div>
    <div class="float prompt" id="prompt" hidden></div>
    <div class="float busy" id="busy" hidden>Přepočítávám model…</div>
    <div class="float info" id="info" hidden></div>
    <div class="float facebar" id="facebar" hidden></div>
    <div class="float toast" id="toast" hidden></div>
    <div class="dim" id="dim" hidden></div>
    <svg class="skdims" id="skdims" aria-hidden="true"></svg>
    <div class="seglabels" id="seglabels" aria-hidden="true"></div>
  </main>

  <footer class="timeline" aria-label="Časová osa">
    <div class="tlctrl">
      <button class="ibtn" id="tl-first" title="Na začátek" aria-label="Na začátek"><span class="ico" data-ic="tfirst" data-s="16"></span></button>
      <button class="ibtn" id="tl-prev" title="O krok zpět" aria-label="O krok zpět"><span class="ico" data-ic="tprev" data-s="16"></span></button>
      <button class="ibtn" id="tl-next" title="O krok vpřed" aria-label="O krok vpřed"><span class="ico" data-ic="tnext" data-s="16"></span></button>
      <button class="ibtn" id="tl-last" title="Na konec" aria-label="Na konec"><span class="ico" data-ic="tlast" data-s="16"></span></button>
    </div>
    <div class="tltrack" id="tltrack"></div>
    <span class="tlname" id="tlname"></span>
  </footer>
</div>
<div class="float menu ctxmenu" id="ctxmenu" hidden></div>
<div class="startdlg" id="startdlg" hidden></div>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/TransformControls.js"></script>
<script>
  document.title = SKICA.full;
  document.getElementById('ver-badge').textContent = SKICA.stage + ' ' + SKICA.version;
</script>
<script src="js/kernel.js"></script>
<script src="js/features.js"></script>
<script src="js/importers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
